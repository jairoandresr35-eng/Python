
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});

const diagram = `erDiagram
  equipos {
    int id PK
    string nombre
    string pais
    string confederacion
  }
  partidos {
    int id PK
    int equipo_local_id FK
    int equipo_visitante_id FK
    date fecha
    string torneo
    string fase
    int goles_local
    int goles_visitante
    string resultado
  }
  r1_ranking_momentum {
    int id PK
    int equipo_id FK
    date fecha_registro
    int posicion_fifa
    float puntos_fifa
    int variacion_3m
    float puntos_elo
    string tendencia
  }
  r2_historia {
    int id PK
    int partido_id FK
    int equipo_local_id FK
    int equipo_visitante_id FK
    int victorias_local_h2h
    int victorias_visitante_h2h
    int empates_h2h
    int racha_local
    int racha_visitante
    float promedio_goles_local
    float promedio_goles_visitante
  }
  r3_estrellas {
    int id PK
    int partido_id FK
    int equipo_id FK
    string jugador_clave
    float valor_mercado_m
    boolean disponible
    string estado_fisico
    int goles_ultimos_5
    int asistencias_ultimos_5
  }
  r4_alineacion_dt {
    int id PK
    int partido_id FK
    int equipo_id FK
    string formacion
    string estilo_tactico
    boolean rotaciones
    int experiencia_dt_anos
    float win_rate_dt
    string alineacion_probable
  }
  r5_prediccion_externa {
    int id PK
    int partido_id FK
    string fuente
    float prob_local
    float prob_empate
    float prob_visitante
    float cuota_local
    float cuota_empate
    float cuota_visitante
    string prediccion_resultado
  }
  r6_prediccion_propia {
    int id PK
    int partido_id FK
    float score_r1
    float score_r2
    float score_r3
    float score_r4
    float score_r5
    float score_total
    string prediccion_final
    string tipo_apuesta
    float confianza_pct
    string resultado_real
    boolean acierto
  }

  equipos ||--o{ partidos : "local"
  equipos ||--o{ partidos : "visitante"
  partidos ||--|| r2_historia : "analiza"
  partidos ||--o{ r3_estrellas : "jugadores"
  partidos ||--o{ r4_alineacion_dt : "tactica"
  partidos ||--o{ r5_prediccion_externa : "fuentes"
  partidos ||--|| r6_prediccion_propia : "modelo"
  equipos ||--o{ r1_ranking_momentum : "seguimiento"
`;

const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
